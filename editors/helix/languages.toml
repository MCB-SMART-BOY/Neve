# Neve language support for Helix Editor
# Copy to: ~/.config/helix/languages.toml
# Or use: neve setup helix

[[language]]
name = "neve"
scope = "source.neve"
file-types = ["neve"]
comment-token = "--"
indent = { tab-width = 4, unit = "    " }
language-servers = ["neve-lsp"]
auto-format = true

[language-server.neve-lsp]
command = "neve"
args = ["lsp"]
