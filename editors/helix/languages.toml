# n3v3 language support for Helix Editor
# Copy to: ~/.config/helix/languages.toml
# Or use: n3v3 setup helix

[[language]]
name = "n3v3"
scope = "source.n3v3"
file-types = ["n3v3"]
comment-token = "--"
indent = { tab-width = 4, unit = "    " }
language-servers = ["n3v3-lsp"]
auto-format = true

[language-server.n3v3-lsp]
command = "n3v3"
args = ["lsp"]
