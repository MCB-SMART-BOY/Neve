# Neve language support for Helix Editor
# Copy to: ~/.config/helix/languages.toml

[[language]]
name = "neve"
scope = "source.neve"
file-types = ["neve"]
comment-token = "--"
indent = { tab-width = 4, unit = "    " }
language-servers = ["neve-lsp"]
formatter = { command = "neve", args = ["fmt", "file", "--write"] }
auto-format = true

[language-server.neve-lsp]
command = "neve"
args = ["lsp"]
