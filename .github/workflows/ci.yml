name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-ci
          cache-on-failure: true

      - name: Build
        run: cargo build --verbose -p neve

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        run: cargo test --verbose -- --nocapture

      - name: Run tests (Windows - language crates only)
        if: matrix.os == 'windows-latest'
        run: cargo test --verbose -p neve-lexer -p neve-parser -p neve-eval -p neve-typeck -p neve-fmt -- --nocapture

      - name: Check formatting
        run: cargo fmt -- --check
        if: matrix.os == 'ubuntu-latest'

      - name: Run clippy (all workspace crates)
        run: cargo clippy --workspace -- -D warnings
        if: matrix.os == 'ubuntu-latest'

  # Security audit for dependency vulnerabilities
  # 依赖安全审计
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-security
          cache-on-failure: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true  # Don't fail CI on audit warnings, just report

  build-check:
    name: Build check on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-build
          cache-on-failure: true

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Check build (native)
        if: ${{ !matrix.cross }}
        run: cargo check --target ${{ matrix.target }} -p neve

      - name: Check build (cross)
        if: matrix.cross
        run: cross check --target ${{ matrix.target }} -p neve

  # Differential testing: Rust vs Lean spec
  # 差分测试：比对 Rust 求值器与 Lean 规范
  diff-test:
    name: Differential Test (Rust ↔ Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-diff-test
          cache-on-failure: true

      - name: Install Lean 4
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.29.1
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: |
            formal/.lake/build
            formal/.lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lakefile.lean', 'formal/Neve/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Build Rust (neve CLI)
        run: cargo build -p neve --release

      - name: Build Lean (lake)
        run: |
          cd formal
          lake build

      - name: Run differential tests
        run: |
          python3 scripts/gen_diff_test.py -n 100 -d 4
