name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true

          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false

          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ matrix.target }}-release
          cache-on-failure: true

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p neve
          else
            cargo build --release --target ${{ matrix.target }} -p neve
          fi
        shell: bash

      - name: Build binary (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo build --release --target ${{ matrix.target }} -p neve

      - name: Strip binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip target/${{ matrix.target }}/release/neve || true
          fi
        shell: bash

      - name: Package binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf neve-${{ matrix.target }}.tar.gz neve
          mv neve-${{ matrix.target }}.tar.gz ../../../
        shell: bash

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a neve-${{ matrix.target }}.zip neve.exe
          mv neve-${{ matrix.target }}.zip ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: neve-${{ matrix.target }}
          path: |
            neve-*.tar.gz
            neve-*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*
          body: |
            ## Neve ${{ github.ref_name }}

            ### Installation

            Download the appropriate binary for your platform:

            - **Linux (x86_64)**: `neve-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux (ARM64)**: `neve-aarch64-unknown-linux-gnu.tar.gz`
            - **macOS (Intel)**: `neve-x86_64-apple-darwin.tar.gz`
            - **macOS (Apple Silicon)**: `neve-aarch64-apple-darwin.tar.gz`
            - **Windows (x86_64)**: `neve-x86_64-pc-windows-msvc.zip`

            Extract and add to your PATH:

            ```bash
            # Linux/macOS
            tar xzf neve-*.tar.gz
            sudo mv neve /usr/local/bin/

            # Or add to user bin
            mkdir -p ~/.local/bin
            mv neve ~/.local/bin/
            ```

            ```powershell
            # Windows
            Expand-Archive neve-x86_64-pc-windows-msvc.zip -DestinationPath .
            # Add neve.exe to your PATH
            ```

            ### Platform Notes

            - **All platforms**: Core language tooling (`eval`, `check`, `repl`, `fmt`) is available; semantic convergence is still ongoing
            - **Unix only**: Package management and system configuration features require Linux/macOS

            ### What's New

            See [CHANGELOG.md](docs/project/changelog.md) for details.

            ---

            ## Neve ${{ github.ref_name }}（中文）

            ### 安装

            下载适合你平台的二进制文件：

            - **Linux (x86_64)**: `neve-x86_64-unknown-linux-gnu.tar.gz`
            - **Linux (ARM64)**: `neve-aarch64-unknown-linux-gnu.tar.gz`
            - **macOS (Intel)**: `neve-x86_64-apple-darwin.tar.gz`
            - **macOS (Apple Silicon)**: `neve-aarch64-apple-darwin.tar.gz`
            - **Windows (x86_64)**: `neve-x86_64-pc-windows-msvc.zip`

            解压后加入 PATH：

            ```bash
            # Linux/macOS
            tar xzf neve-*.tar.gz
            sudo mv neve /usr/local/bin/

            # 或加入用户目录
            mkdir -p ~/.local/bin
            mv neve ~/.local/bin/
            ```

            ```powershell
            # Windows
            Expand-Archive neve-x86_64-pc-windows-msvc.zip -DestinationPath .
            # 将 neve.exe 加入 PATH
            ```

            ### 平台说明

            - **全部平台**: 核心语言工具链（`eval`/`check`/`repl`/`fmt`）可用，但语义闭环仍在持续收敛
            - **仅 Unix**: 包管理与系统配置功能需要 Linux/macOS

            ### 更新内容

            详见 [CHANGELOG.md](docs/project/changelog.md)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
