<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- Soft "frost glow" behind the mark -->
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(128 128) scale(120)">
      <stop offset="0" stop-color="#5fb8f2" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#aaa1f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Glow layer (kept subtle; remove this circle if you want pure transparent background) -->
  <circle cx="128" cy="128" r="118" fill="url(#glow)"/>

  <!-- Mark -->
  <g transform="translate(128 128)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Blue arms -->
    <g stroke="#5fb8f2">
      <g transform="rotate(0)"><path d="M 0 -96 V -64 H 26"/></g>
      <g transform="rotate(120)"><path d="M 0 -96 V -64 H 26"/></g>
      <g transform="rotate(240)"><path d="M 0 -96 V -64 H 26"/></g>
    </g>

    <!-- Violet arms -->
    <g stroke="#aaa1f6">
      <g transform="rotate(60)"><path d="M 0 -96 V -64 H 26"/></g>
      <g transform="rotate(180)"><path d="M 0 -96 V -64 H 26"/></g>
      <g transform="rotate(300)"><path d="M 0 -96 V -64 H 26"/></g>
    </g>

    <!-- Center dot: "ice core" -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" fill-opacity="0.9" stroke="none"/>
  </g>
</svg>
