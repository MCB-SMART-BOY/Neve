[package]
name = "n3v3"
description = "The Neve language CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "neve"
path = "src/main.rs"

[dependencies]
neve-common = { version = "5.0.0", path = "../crates/neve-common" }
neve-diagnostic = { version = "5.0.0", path = "../crates/neve-diagnostic" }
neve-syntax = { version = "5.0.0", path = "../crates/neve-syntax" }
neve-parser = { version = "5.0.0", path = "../crates/neve-parser" }
neve-hir = { version = "5.0.0", path = "../crates/neve-hir" }
neve-typeck = { version = "5.0.0", path = "../crates/neve-typeck" }
neve-eval = { version = "5.0.0", path = "../crates/neve-eval" }
neve-std = { version = "5.0.0", path = "../crates/neve-std" }
neve-fmt = { version = "5.0.0", path = "../crates/neve-fmt" }
neve-frontend = { version = "5.0.0", path = "../crates/neve-frontend" }
neve-lsp = { version = "5.0.0", path = "../crates/neve-lsp" }

clap.workspace = true
rustyline.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
serde.workspace = true
termimad = "0.30"

[dev-dependencies]
tempfile.workspace = true

# Unix-only dependencies for package management features
[target.'cfg(unix)'.dependencies]
neve-config = { version = "5.0.0", path = "../crates/neve-config" }
neve-store = { version = "5.0.0", path = "../crates/neve-store" }
neve-derive = { version = "5.0.0", path = "../crates/neve-derive" }
neve-builder = { version = "5.0.0", path = "../crates/neve-builder" }
neve-fetch = { version = "5.0.0", path = "../crates/neve-fetch" }
reqwest = { workspace = true }
libc.workspace = true
